spring:
  application:
    name: upismart-backend
  datasource:
    # Default to H2 in-memory database with MySQL syntax compatibility for immediate local testing & development.
    # In production, this is overridden by application-prod.yml or environment variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:upismart_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  demo:
    initial-salary: 50000.00
    initial-vault-reserve: 15000.00
    demo-pin: "1234"
  security:
    api-key: ${APP_API_KEY:upismart-demo-secure-key-2026}

